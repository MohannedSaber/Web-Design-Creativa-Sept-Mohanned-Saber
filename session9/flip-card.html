<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flip-Card</title>
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/flip-card.css" />
    <link rel="stylesheet" href="css/flip-card-responsive.css" />
  </head>
  <body>
    <section class="container">
      <div class="flip-card">
        <div class="overlay"></div>
        <div class="inner-card">
          <div class="front">
            <h3>Financial Sector Development Program</h3>
            <i class="fa-solid fa-arrow-right"></i>
          </div>
          <div class="back">
            <div class="logo">
              <img src="assets/back-card.png" alt="" />
            </div>
            <h3>Financial Sector Development Program</h3>
            <p>
              The Program aims to develop a diversified and effective financial
              sector to support the development of the Saudi Arabia's economy.
            </p>
            <div class="btn">
              <button>
                Read More
                <i class="fa-solid fa-arrow-right"></i>
              </button>
              <div class="icon">
                <i class="fa-solid fa-arrow-right"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
