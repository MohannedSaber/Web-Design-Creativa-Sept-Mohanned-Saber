<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <h2>Registration Form</h2>
        <div>
            <label for="firstName">First Name: </label>
            <input id="firstName" type="text" required name="firstName" autofocus>
        </div>
        <div>
            <label for="userEmail">Email: </label>
            <input id="userEmail" type="email" name="userEmail">
        </div>
        <div>
            <label for="userAge">Age: </label>
            <input id="userAge" type="number" min="10" max="26" name="userAge">
        </div>
        <div>
            <label for="">shopping area: </label>
            <input type="text" value="Alex" disabled name="shopping">
        </div>
        <div>
            <label for="">shopping area: </label>
            <input type="text" value="Alex" readonly name="shoppingArea">
        </div>
        <div>
            <label for="userPassword">Password: </label>
            <input type="password" required id="userPassword" name="userPassword">
        </div>
        <div>
            <label for="">Gender: </label>
            <label for="">Male</label> <input type="radio" name="Gender">
            <label for="">Female</label> <input type="radio" name="Gender">
        </div>
        <div>
            <input type="checkbox" name="userchooses" id="userchooses"> <label for="userchooses">Frontend</label>
            <input type="checkbox" name="userchooses" id="userchooses"> <label for="userchooses">backend</label>
            <input type="checkbox" name="userchooses" id="userchooses"> <label for="userchooses">networking</label>
        </div>
        <div>
            <input type="file" multiple>
        </div>
        <div></div>

        <!-- fieldset , datalist , legened -->
    </form>
</body>
</html>
