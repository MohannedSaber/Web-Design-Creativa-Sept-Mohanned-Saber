<body>
    <form action="">
        <div>
            <label for="">FisrtName: </label>
            <input type="text" pattern="[A-Za-z]">
        </div>
        <div>
            <label for="">Phone: </label>
            <input type="number" max="11" pattern="(011|012|010|015){0 , 9}{8}">
        </div>
        <div>
            <label for="">img: </label>
            <input type="file" multiple accept="image/png">
        </div>
        <div>
            <label for="">comment: </label>
            <textarea name="textarea" id="textarea" minlength="20" maxlength="100"></textarea>
        </div>
        <div>
            <label for="Date: "></label>
            <input type="date" required>
        </div>
        <div>
            <label for="">ID: </label>
            <input type="number">
        </div>
        <button>Submit</button>
